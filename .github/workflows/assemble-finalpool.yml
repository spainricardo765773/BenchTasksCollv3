name: Assemble finalpool
on:
  push:
    branches: [finalpool]
permissions:
  contents: write
jobs:
  assemble:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy implemented tasks
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          python3 - <<'PY'
          import csv, shutil, subprocess, tempfile
          from pathlib import Path
          repo = Path.cwd()
          manifest = repo / 'finalpool-manifest.csv'
          if not manifest.exists():
              print('No manifest; nothing to do.')
              raise SystemExit(0)
          dest_root = repo / 'tasks' / 'finalpool'
          dest_root.mkdir(parents=True, exist_ok=True)
          rows = list(csv.DictReader(manifest.open()))
          with tempfile.TemporaryDirectory() as tmp:
              tmp = Path(tmp)
              for row in rows:
                  branch, owner, task = row['branch'], row['owner'], row['task']
                  src = f'tasks/{owner}/{task}'
                  archive = subprocess.run(
                      ['git', 'archive', f'origin/{branch}', src],
                      check=True, capture_output=True
                  ).stdout
                  extract = tmp / 'extract'
                  if extract.exists():
                      shutil.rmtree(extract)
                  extract.mkdir()
                  subprocess.run(['tar', '-x', '-C', str(extract)], input=archive, check=True)
                  src_dir = extract / src
                  if not src_dir.is_dir():
                      raise RuntimeError(f'Missing source directory: {branch}:{src}')
                  dst_dir = dest_root / task
                  if dst_dir.exists():
                      shutil.rmtree(dst_dir)
                  shutil.copytree(src_dir, dst_dir)
                  print(f'copied {branch}:{src} -> tasks/finalpool/{task}')
          manifest.unlink()
          workflow = repo / '.github' / 'workflows' / 'assemble-finalpool.yml'
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tasks/finalpool finalpool-manifest.csv .github/workflows/assemble-finalpool.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Assemble implemented tasks into tasks/finalpool [skip ci]"
            git push origin HEAD:finalpool
          fi
